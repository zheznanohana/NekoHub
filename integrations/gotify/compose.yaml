name: nekohub
services:
  gotify:
    image: gotify/server:3.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOTIFY_PORT:-18080}:80"
    environment:
      GOTIFY_DEFAULTUSER_NAME: "${GOTIFY_ADMIN_USER:-admin}"
      GOTIFY_DEFAULTUSER_PASS: "${GOTIFY_ADMIN_PASSWORD:?Set a strong password in .env}"
      TZ: Asia/Tokyo
    volumes:
      - gotify-data:/app/data
volumes:
  gotify-data:
